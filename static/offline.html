
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b50">
  <title>KAFU Smart Lost &amp; Found - Offline</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      color: #102b50;
      text-align: center;
      padding: 40px 20px;
      margin: 0;
    }
    main {
      max-width: 480px;
      margin: 40px auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 18px #102b501a;
    }
    button {
      background: #102b50;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>📴 You're Offline</h1>
    <p>KAFU Smart Lost &amp; Found</p>
    <p>You don't currently have an internet connection.</p>
    <p>Reconnect to the internet to submit reports and view the latest items.</p>
    <button onclick="location.reload()">Try Again</button>
  </main>
</body>
</html>
